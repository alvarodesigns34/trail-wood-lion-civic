# Publica el laboratorio en GitHub Pages.
#
# El sitio publicado es la compilación estática de `vite.pages.config.mts`: sólo
# cliente, sin servidor, sin sesión y sin base de datos. La aplicación completa
# (con SSR) se sigue construyendo con `npm run build` y no la toca este flujo.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "screenshots/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Compilar el laboratorio
        run: npm run build:pages
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
